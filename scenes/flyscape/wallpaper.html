<!doctype html>
<html lang="en" data-fit="fill" data-motion="host">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#161009" />
    <meta
      name="description"
      content="Fly world, framed to fill a screen as a desktop wallpaper."
    />
    <title>Fly world • Deskworlds wallpaper</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="stage" aria-label="Interactive desk with fruit flies">
      <canvas id="scene" tabindex="-1"></canvas>
      <aside id="brain-panel" aria-label="Live fly brain" hidden>
        <h2>fly 1 · live brain</h2>
        <canvas width="300" height="300"></canvas>
        <div class="brain-flies" role="group" aria-label="Watched fly"></div>
        <div class="brain-rates" aria-live="off"></div>
        <p>somas flash where spikes fire · rates are the watched fly</p>
      </aside>
      <div id="loading" role="status"><p>Loading world…</p></div>
      <div id="error" role="alert" hidden></div>
    </main>
    <script type="module" src="../shared/start.js" data-entry="./src/main.js"></script>
  </body>
</html>
