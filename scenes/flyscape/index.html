<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#161009" />
    <meta
      name="description"
      content="A desk at dusk where fruit flies walk, groom and take off between the books. A local, interactive 3D preview."
    />
    <title>Fly world • Deskworlds</title>
    <link rel="icon" href="../../ui/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="stage" aria-label="Interactive desk with fruit flies">
      <canvas
        id="scene"
        aria-label="A desk at dusk with fruit flies. Move the pointer near a fly to see it react. Click to drop sugar. Space pauses. F enters fullscreen. H hides controls."
        tabindex="0"
      ></canvas>
      <nav class="chrome" aria-label="Worlds">
        <a class="home-link" href="../../" aria-label="Deskworlds home">Deskworlds</a>
        <div class="scene-nav">
          <a href="../riverscape/">Riverbed</a>
          <a href="../reefscape/">Coral reef</a>
          <a href="../bettascape/">Betta</a>
          <a href="../plasmascape/">Plasma globe</a>
          <a href="../koiscape/">Koi pond</a>
          <a href="../bonfirescape/">Bonfire</a>
          <span aria-current="page">Fly world</span>
        </div>
      </nav>
      <footer class="chrome" aria-label="World controls">
        <div class="buttons">
          <button disabled id="pause" aria-pressed="false" title="Space">Pause</button>
          <button disabled id="feed">Feed</button>
          <button disabled id="fullscreen" title="F">Fullscreen</button>
          <button disabled id="brain" aria-pressed="false" title="B">Brain</button>
        </div>
        <div class="preferences">
          <select disabled id="quality" aria-label="Quality">
            <option value="eco">Eco</option>
            <option value="balanced" selected>Balanced</option>
            <option value="detail">Detail</option>
          </select>
          <button disabled id="hide" title="H">Hide controls</button>
        </div>
      </footer>
      <button disabled id="show-controls" title="H">Show controls</button>
      <aside id="brain-panel" aria-label="Live fly brain" hidden>
        <h2>fly 1 · live brain</h2>
        <canvas width="300" height="300"></canvas>
        <canvas class="brain-raster" width="300" height="64" aria-label="Spike raster of identified populations"></canvas>
        <div class="brain-flies" role="group" aria-label="Watched fly"></div>
        <div class="brain-rates" aria-live="off"></div>
        <p>somas and raster flash where spikes fire · rates are the watched fly</p>
      </aside>
      <div id="loading" role="status"><p>Loading world…</p></div>
      <div id="error" role="alert" hidden></div>
    </main>
    <script type="module" src="../shared/start.js" data-entry="./src/main.js"></script>
  </body>
</html>
