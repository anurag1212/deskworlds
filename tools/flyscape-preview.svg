<!-- Source for docs/images/flyscape-wide.png (rasterized with qlmanage -t -s 1440).
     A stylized stand-in for a live render: the desk at dusk, the book stack, the mug,
     the window light, and three flies. Regenerate with:
       qlmanage -t -s 1440 -o /tmp tools/flyscape-preview.svg && mv /tmp/flyscape-preview.svg.png docs/images/flyscape-wide.png
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="750" viewBox="0 0 1440 750">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0a06"/>
      <stop offset="0.62" stop-color="#1c130c"/>
      <stop offset="1" stop-color="#2a1c11"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.24" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ffcf9e" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#c98a4e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3b6"/>
      <stop offset="1" stop-color="#f2b877"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4a2e"/>
      <stop offset="0.1" stop-color="#5c402a"/>
      <stop offset="1" stop-color="#3a2718"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="750" fill="url(#room)"/>
  <rect width="1440" height="750" fill="url(#glow)"/>

  <!-- window and its light on the wall -->
  <g>
    <rect x="120" y="70" width="340" height="430" rx="6" fill="#33261a"/>
    <rect x="132" y="82" width="316" height="406" rx="3" fill="url(#pane)"/>
    <rect x="286" y="82" width="10" height="406" fill="#33261a" opacity="0.85"/>
    <rect x="132" y="272" width="316" height="10" fill="#33261a" opacity="0.85"/>
    <polygon points="132,488 448,488 980,750 240,750" fill="url(#beam)"/>
  </g>

  <!-- desk -->
  <rect x="0" y="560" width="1440" height="190" fill="url(#desk)"/>
  <rect x="0" y="560" width="1440" height="8" fill="#7a5636" opacity="0.8"/>
  <ellipse cx="1020" cy="700" rx="560" ry="90" fill="#000000" opacity="0.22"/>

  <!-- paper -->
  <g transform="rotate(-11 1010 640)">
    <rect x="800" y="580" width="420" height="150" rx="3" fill="#c9c0ab"/>
    <rect x="800" y="580" width="420" height="150" rx="3" fill="#000000" opacity="0.06"/>
  </g>

  <!-- pencil -->
  <g transform="rotate(9 560 680)">
    <rect x="420" y="676" width="330" height="12" rx="6" fill="#c9a13f"/>
    <polygon points="750,676 782,682 750,688" fill="#2b2119"/>
  </g>

  <!-- book stack -->
  <g>
    <rect x="430" y="470" width="330" height="52" rx="4" fill="#7c3b31"/>
    <rect x="438" y="478" width="314" height="30" rx="3" fill="#d9cdb2"/>
    <rect x="452" y="420" width="296" height="50" rx="4" fill="#40573f"/>
    <rect x="460" y="428" width="280" height="28" rx="3" fill="#d9cdb2"/>
    <rect x="472" y="372" width="262" height="48" rx="4" fill="#33405b"/>
    <rect x="480" y="380" width="246" height="26" rx="3" fill="#d9cdb2"/>
  </g>

  <!-- mug -->
  <g>
    <path d="M1050 452 h150 v96 a75 30 0 0 1 -150 0 z" fill="#cfc3ad"/>
    <ellipse cx="1125" cy="452" rx="75" ry="22" fill="#e6dcc7"/>
    <ellipse cx="1125" cy="452" rx="58" ry="15" fill="#8a6f4c"/>
    <path d="M1200 470 q60 10 44 48 q-12 30 -50 26" fill="none" stroke="#cfc3ad" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- flies: one on the paper, one on a book edge, one in the air -->
  <g fill="#3a322b">
    <g transform="translate(930 632) rotate(-18)">
      <ellipse cx="0" cy="0" rx="14" ry="9"/>
      <ellipse cx="-16" cy="2" rx="10" ry="6" opacity="0.9"/>
      <ellipse cx="8" cy="-9" rx="16" ry="6" fill="#d9dedb" opacity="0.5" transform="rotate(-24)"/>
      <ellipse cx="-6" cy="-9" rx="15" ry="6" fill="#d9dedb" opacity="0.5" transform="rotate(18)"/>
      <circle cx="13" cy="-2" r="3.4" fill="#8c3028"/>
      <g stroke="#2c2520" stroke-width="1.6" fill="none">
        <path d="M-8 7 l-6 8"/><path d="M0 9 l0 9"/><path d="M8 7 l6 8"/>
      </g>
    </g>
    <g transform="translate(520 366) rotate(8)">
      <ellipse cx="0" cy="0" rx="12" ry="8"/>
      <ellipse cx="-14" cy="2" rx="9" ry="5" opacity="0.9"/>
      <ellipse cx="7" cy="-8" rx="14" ry="5" fill="#d9dedb" opacity="0.5" transform="rotate(-22)"/>
      <ellipse cx="-5" cy="-8" rx="13" ry="5" fill="#d9dedb" opacity="0.5" transform="rotate(16)"/>
      <circle cx="11" cy="-2" r="3" fill="#8c3028"/>
      <g stroke="#2c2520" stroke-width="1.4" fill="none">
        <path d="M-7 6 l-5 7"/><path d="M0 8 l0 8"/><path d="M7 6 l5 7"/>
      </g>
    </g>
    <g transform="translate(716 240) rotate(-6)">
      <ellipse cx="0" cy="0" rx="13" ry="8"/>
      <ellipse cx="-15" cy="2" rx="9" ry="5" opacity="0.9"/>
      <ellipse cx="6" cy="-16" rx="18" ry="6" fill="#d9dedb" opacity="0.6" transform="rotate(-34)"/>
      <ellipse cx="-8" cy="-16" rx="17" ry="6" fill="#d9dedb" opacity="0.6" transform="rotate(26)"/>
      <circle cx="12" cy="-2" r="3.2" fill="#8c3028"/>
      <g stroke="#2c2520" stroke-width="1.4" fill="none">
        <path d="M-7 6 l-5 8"/><path d="M0 8 l1 9"/><path d="M7 6 l6 8"/>
      </g>
    </g>
  </g>

  <!-- dust in the light -->
  <g fill="#ffe3b3">
    <circle cx="300" cy="220" r="2.2" opacity="0.5"/>
    <circle cx="392" cy="330" r="1.6" opacity="0.4"/>
    <circle cx="244" cy="420" r="1.8" opacity="0.35"/>
    <circle cx="520" cy="180" r="1.5" opacity="0.4"/>
    <circle cx="660" cy="300" r="1.9" opacity="0.3"/>
    <circle cx="828" cy="212" r="1.4" opacity="0.35"/>
  </g>
</svg>
